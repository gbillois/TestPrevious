<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake — Arcade Classic</title>
  <style>
    :root { color-scheme: dark; --lime: #b8ff5a; --ink: #0b110d; --panel: #151d18; --muted: #94a198; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #f4f8f5; background: radial-gradient(circle at 50% 0%, #243329 0, #0b110d 52%);
    }
    main { width: min(92vw, 560px); }
    header { display: flex; align-items: end; justify-content: space-between; margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(2.4rem, 10vw, 4.6rem); line-height: .8; letter-spacing: -.1em; color: var(--lime); }
    .scoreboard { display: flex; gap: 22px; text-align: right; }
    .stat span { display: block; color: var(--muted); font-size: .7rem; letter-spacing: .12em; }
    .stat strong { font-size: 1.5rem; }
    .game-shell { position: relative; padding: 10px; border: 1px solid #344239; border-radius: 14px; background: var(--panel); box-shadow: 0 24px 70px #0008; }
    canvas { display: block; width: 100%; aspect-ratio: 1; border-radius: 8px; background: #0c130e; }
    .overlay { position: absolute; inset: 10px; display: grid; place-items: center; border-radius: 8px; background: #071009c9; text-align: center; backdrop-filter: blur(3px); }
    .overlay[hidden] { display: none; }
    .overlay h2 { margin: 0 0 8px; font-size: 2rem; color: var(--lime); }
    .overlay p { max-width: 290px; margin: 0 0 24px; color: #c6d0c9; line-height: 1.6; font-size: .85rem; }
    button { border: 0; border-radius: 999px; padding: 13px 26px; font: 700 .8rem inherit; letter-spacing: .08em; cursor: pointer; color: var(--ink); background: var(--lime); box-shadow: 0 0 25px #b8ff5a35; }
    button:hover { transform: translateY(-1px); background: #cbff87; }
    .controls { margin-top: 16px; display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: .72rem; }
    kbd { padding: 3px 6px; border: 1px solid #465249; border-radius: 4px; color: #dce4de; background: #1a241d; box-shadow: 0 2px 0 #050806; }
    .dpad { display: none; grid-template-columns: repeat(3, 48px); justify-content: center; margin-top: 16px; }
    .dpad button { width: 44px; height: 40px; padding: 0; border-radius: 9px; font-size: 1rem; }
    .dpad .up { grid-column: 2; } .dpad .left { grid-column: 1; grid-row: 2; } .dpad .down { grid-column: 2; grid-row: 2; } .dpad .right { grid-column: 3; grid-row: 2; }
    @media (pointer: coarse), (max-width: 600px) { .dpad { display: grid; } .controls { justify-content: center; } .controls span:first-child { display: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>SNAKE</h1>
      <div class="scoreboard">
        <div class="stat"><span>SCORE</span><strong id="score">00</strong></div>
        <div class="stat"><span>BEST</span><strong id="best">00</strong></div>
      </div>
    </header>
    <div class="game-shell">
      <canvas id="game" width="500" height="500" aria-label="Snake game board"></canvas>
      <div class="overlay" id="overlay">
        <div><h2 id="message">READY?</h2><p id="hint">Eat the fruit, grow your snake, and don't hit the walls or yourself.</p><button id="start">START GAME</button></div>
      </div>
    </div>
    <div class="controls"><span><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span><kbd>SPACE</kbd> pause</span></div>
    <div class="dpad" aria-label="Touch controls">
      <button class="up" data-dir="up">↑</button><button class="left" data-dir="left">←</button><button class="down" data-dir="down">↓</button><button class="right" data-dir="right">→</button>
    </div>
  </main>
  <script>
    const canvas = document.querySelector('#game'), ctx = canvas.getContext('2d');
    const scoreEl = document.querySelector('#score'), bestEl = document.querySelector('#best');
    const overlay = document.querySelector('#overlay'), message = document.querySelector('#message'), hint = document.querySelector('#hint');
    const size = 20, cells = canvas.width / size;
    let snake, food, direction, nextDirection, score, timer, running = false, paused = false;
    let best = Number(localStorage.getItem('snake-best') || 0); bestEl.textContent = String(best).padStart(2, '0');

    function placeFood() {
      do food = { x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells) };
      while (snake.some(part => part.x === food.x && part.y === food.y));
    }
    function reset() {
      snake = [{x: 12, y: 12}, {x: 11, y: 12}, {x: 10, y: 12}]; direction = nextDirection = {x: 1, y: 0}; score = 0;
      scoreEl.textContent = '00'; placeFood(); draw();
    }
    function start() {
      clearInterval(timer); reset(); running = true; paused = false; overlay.hidden = true; timer = setInterval(tick, 105);
    }
    function tick() {
      if (paused) return; direction = nextDirection;
      const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
      if (head.x < 0 || head.y < 0 || head.x >= cells || head.y >= cells || snake.some(p => p.x === head.x && p.y === head.y)) return gameOver();
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) { score++; scoreEl.textContent = String(score).padStart(2, '0'); placeFood(); } else snake.pop();
      draw();
    }
    function draw() {
      ctx.fillStyle = '#0c130e'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#152019'; ctx.lineWidth = 1;
      for (let i = size; i < canvas.width; i += size) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }
      ctx.fillStyle = '#ff6b55'; ctx.beginPath(); ctx.arc(food.x*size+10, food.y*size+10, 7, 0, Math.PI*2); ctx.fill();
      snake.forEach((part, i) => { ctx.fillStyle = i ? '#81c947' : '#b8ff5a'; ctx.fillRect(part.x*size+2, part.y*size+2, size-4, size-4); });
    }
    function gameOver() {
      clearInterval(timer); running = false; best = Math.max(best, score); localStorage.setItem('snake-best', best); bestEl.textContent = String(best).padStart(2, '0');
      message.textContent = 'GAME OVER'; hint.textContent = `You scored ${score}. Ready for another run?`; document.querySelector('#start').textContent = 'PLAY AGAIN'; overlay.hidden = false;
    }
    function steer(name) {
      const dirs = {up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}, wanted = dirs[name];
      if (wanted && !(wanted.x === -direction.x && wanted.y === -direction.y)) nextDirection = wanted;
    }
    document.addEventListener('keydown', e => {
      const keys = {ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
      if (keys[e.key]) { e.preventDefault(); steer(keys[e.key]); }
      if (e.code === 'Space' && running) { e.preventDefault(); paused = !paused; message.textContent = 'PAUSED'; hint.textContent = 'Press space to keep moving.'; overlay.hidden = !paused; }
    });
    document.querySelector('#start').addEventListener('click', start);
    document.querySelectorAll('[data-dir]').forEach(button => button.addEventListener('pointerdown', () => steer(button.dataset.dir)));
    reset();
  </script>
</body>
</html>
